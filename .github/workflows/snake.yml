name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rhythmmanandhar
          outputs: dist/snake.svg?color_snake=BC6C25&color_dots=F5E6D3,E9C46A,DDA15E,BC6C25,7A4416

      - name: Verify output
        run: |
          ls -la dist
          grep -o '#[0-9A-Fa-f]\{6\}' dist/snake.svg | sort -u

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
