name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: "dist/snake.svg?color_snake=A87244&color_dots=E8D5C4,D9A87C,C99A66,A87244,6B4423"

      - name: Show generated colors
        run: |
          echo "--- files ---"
          ls -la dist
          echo "--- color values found ---"
          grep -o '#[0-9A-Fa-f]\{6\}' dist/snake.svg | sort -u | head -20

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
